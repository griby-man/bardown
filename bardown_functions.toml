# EA CRT setjmp/longjmp. checked against the generated code:
#   0x83075BF0 saves f14-f31 + r13-r31 into the buffer at r3, restores nothing (26 callers)
#   0x83073980 reloads them all from r3, forces a 0 value to 1 (78 callers)
setjmp_address = 0x83075BF0
longjmp_address = 0x83073980

# function entries the scanner misses. all four are reached only by a tail-call `b`,
# so discovery never registers them and validate reports UnresolvedCall.

[functions]
0x82E5EE90 = { name = "sub_82E5EE90" }  # b from 0x82E84BD4
0x82E73DD0 = { name = "sub_82E73DD0" }  # b from 0x82E73EE4
0x82E89E18 = { name = "sub_82E89E18" }  # b from 0x82E8C114
0x82EB9DB8 = { name = "sub_82EB9DB8" }  # b from 0x82EE4FC4

# gapfill splits these in two: a caller-less sub_ lands mid-function and takes the labels
# the real body jumps to, so the build fails with undeclared loc_ labels. end = next real function.
0x82A66508 = { name = "sub_82A66508", end = 0x82A67600 }  # swallows sub_82A67248
0x82BBF100 = { name = "sub_82BBF100", end = 0x82BBF558 }  # swallows sub_82BBF3A8

# boot fatals and harvest runs (scripts/run.sh harvest)
0x826EB878 = { name = "sub_826EB878" }  # .big mount sequence

