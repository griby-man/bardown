name: lint

# the checks that need no game data: cppcheck over bardown's own code (the same tools/lint.sh as a local run),
# the SDK and shader translator patches still applying to the pinned submodules, and the scripts parsing.
# a few minutes on Linux runners, so it runs on every push and pull request.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Arch, for the same current cppcheck as development uses (Ubuntu's is far older and reports differently)
    container: docker.io/library/archlinux:latest
    timeout-minutes: 20
    steps:
      # git first, so checkout clones with git and can fetch the submodules
      - name: Tools
        run: pacman -Syu --noconfirm --needed git cppcheck

      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: cppcheck
        run: tools/lint.sh

      - name: Patches apply
        run: |
          git config --global --add safe.directory '*'
          git -C third_party/rexglue-sdk apply --check ../../sdk/bardown-sdk.patch
          git -C third_party/rexglue-sdk apply --check ../../sdk/sound-log.patch
          git -C third_party/XenosRecomp apply --check ../../sdk/xenosrecomp.patch

      - name: Scripts parse
        run: |
          for f in scripts/*.sh tools/*.sh; do bash -n "$f"; done
          sh -n packaging/AppRun
