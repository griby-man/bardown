name: macos

# the macOS build. there's no Mac here, so this is the only place it gets made. macOS runners bill at ten
# times the minutes on a private repo, so it runs when asked or for a tag, never on an ordinary push.
# generated/ isn't in the repo: scripts/ci-generated.sh attaches it, encrypted, to the ci-generated release.
# one app for every Mac: built on an Apple Silicon and an Intel runner side by side, then joined into a
# universal app, so it doesn't matter which Mac it lands on
on:
  workflow_dispatch:
  push:
    # ci-mac-* builds a branch that isn't on main yet (a manual run needs the workflow on the default branch)
    tags: ['v*', 'ci-mac-*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            flags: ''
          - arch: x86_64
            runner: macos-26-intel
            flags: -march=x86-64-v2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      ARCH: ${{ matrix.arch }}
      CPU_FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # ccache brings Homebrew's fmt along. on Intel Macs its headers land in /usr/local/include, which the compiler
      # always searches, so the game compiled against that fmt while linking the SDK's: unlinked, ccache keeps its copy
      - name: Tools
        run: |
          brew install ninja vulkan-loader molten-vk ccache zstd
          brew unlink fmt || true

      - name: Patches
        run: |
          git -C third_party/rexglue-sdk apply ../../sdk/bardown-sdk.patch
          git -C third_party/rexglue-sdk apply ../../sdk/sound-log.patch
          git -C third_party/XenosRecomp apply ../../sdk/xenosrecomp.patch

      # pinned to a commit, not a tag a third party can move; and set up before generated/ is decrypted
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@33522472633dbd32578e909b315f5ee43ba878ce # v1.2.22
        with:
          key: macos-${{ matrix.arch }}
          max-size: 3G

      - name: Generated code
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_KEY: ${{ secrets.GENERATED_KEY }}
        run: |
          gh release download ci-generated -R "$GITHUB_REPOSITORY" -p generated.tar.zst.gpg
          printf '%s' "$GENERATED_KEY" > key && chmod 600 key
          gpg --batch --passphrase-file key -d generated.tar.zst.gpg | zstd -d | tar -x
          rm key generated.tar.zst.gpg
          ls generated/default | wc -l

      # MoltenVK's build fetches CPM.cmake and its sources from GitHub at configure time, with no retry: one dropped
      # download (v0.3.7's Intel job) and the build fails. kept between runs, fetched with retries when missing
      - name: MoltenVK sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ matrix.arch }}-${{ hashFiles('third_party/rexglue-sdk/thirdparty/moltenvk/cmake/**') }}

      - name: SDK
        run: |
          cpm=~/.cache/CPM/cpm/CPM_0.40.8.cmake
          if [ ! -s "$cpm" ]; then
            mkdir -p "$(dirname "$cpm")"
            curl -fsSL --retry 5 --retry-all-errors -o "$cpm" \
              https://github.com/cpm-cmake/CPM.cmake/releases/download/v0.40.8/CPM.cmake
          fi
          for i in 1 2 3; do
            cmake -S third_party/rexglue-sdk -B sdk-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="$ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
              -DCMAKE_C_FLAGS="$CPU_FLAGS" -DCMAKE_CXX_FLAGS="$CPU_FLAGS" \
              -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_INSTALL_PREFIX="$PWD/sdk-install" && break
            [ $i = 3 ] && exit 1
            sleep 30
          done
          cmake --build sdk-build --target install --parallel

      - name: Shader translator
        run: |
          cmake -S third_party/XenosRecomp -B xr-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_OSX_ARCHITECTURES="$ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
            -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build xr-build --parallel

      - name: bardown
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBARDOWN_SKIP_CODEGEN=ON \
            -DCMAKE_OSX_ARCHITECTURES="$ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
            -DCMAKE_C_FLAGS="$CPU_FLAGS" -DCMAKE_CXX_FLAGS="$CPU_FLAGS" \
            -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -Drexglue_DIR="$PWD/sdk-install/lib/cmake/rexglue"
          cmake --build build --parallel 3 -- -k 0

      # everything the program loads sits beside it in the app's Contents/MacOS, and the loader is pointed there
      - name: Gather
        run: |
          out="mac-$ARCH"
          mkdir -p "$out"
          cp build/bardown "$out/"
          cp sdk-install/lib/librexruntime.dylib build/librexgpu-native.dylib build/librexgpu-xenos.dylib "$out/"
          if [ -d build/vulkan ]; then cp -R build/vulkan "$out/"; fi
          cp xr-build/XenosRecomp/XenosRecomp "$out/xenosrecomp"
          cp third_party/XenosRecomp/thirdparty/dxc-bin/lib/arm64/libdxcompiler.dylib "$out/"
          cp third_party/XenosRecomp/XenosRecomp/shader_common.h "$out/"
          for f in "$out/bardown" "$out/xenosrecomp" "$out"/*.dylib; do
            install_name_tool -add_rpath @executable_path "$f" 2>/dev/null || true
          done
          otool -L "$out/bardown" "$out/xenosrecomp"
          tar -cf "mac-$ARCH.tar" "$out"

      - uses: actions/upload-artifact@v5
        with:
          name: mac-${{ matrix.arch }}
          path: mac-${{ matrix.arch }}.tar
          retention-days: 3

  package:
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: mac-*
          merge-multiple: true

      - name: bardown.app and the .dmg
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ $GITHUB_REF == refs/tags/v* ]] || version="$(git rev-parse --short HEAD)"
          scripts/macos-package.sh "$version"
          echo "DMG=bardown-$version-macos-universal.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: bardown-macos-universal
          path: ${{ env.DMG }}
          retention-days: 14

      # a version tag's build goes onto that version's release by itself
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber -R "$GITHUB_REPOSITORY"
